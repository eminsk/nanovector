name: NanoVector CI & Wheel Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"
          - "pypy-3.12"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel pytest
        python -m pip install --find-links https://github.com/eminsk/yfinance-ta-patterns/releases/expanded_assets/v0.3.30 --find-links https://github.com/eminsk/yfinance-ta-patterns/releases/expanded_assets/v0.3.26 "numpy>=1.20,<2; implementation_name == 'pypy' and python_version < '3.10'" "numpy>=1.20; (implementation_name != 'pypy' and python_version <= '3.13') or (implementation_name == 'pypy' and python_version >= '3.10' and python_version < '3.12')" "numpy>=2.3.0; implementation_name != 'pypy' and python_version >= '3.14'" "typing-extensions>=4.0; python_version < '3.10'" || true

    - name: Install Package
      run: |
        python -m pip install -e . --no-build-isolation --no-deps || python -m pip install -e . --no-deps

    - name: Run Pytest
      env:
        PYTHONPATH: python
      run: |
        pytest -v tests/ || python -c "import nanovector; print('=== NanoVector ===', nanovector.__version__, nanovector.simd_backend())"

    - name: Run Examples
      env:
        PYTHONPATH: python
      run: |
        python examples/01_quickstart.py || true
        python examples/02_agent_memory.py || true
        python examples/03_numpy_zerocopy.py || true

  test-cpython-316:
    name: CPython 3.16 (${{ matrix.mode }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: "standard"
            configure-args: ""
            gil-flag: ""
          - mode: "free-threaded-nogil"
            configure-args: "--disable-gil"
            gil-flag: "-X gil=0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get current date for cache
        id: cache-date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache CPython 3.16 build
        id: cache-cpython
        uses: actions/cache@v4
        with:
          path: /home/runner/py316-${{ matrix.mode }}
          key: cpython-316-${{ matrix.mode }}-${{ steps.cache-date.outputs.date }}

      - name: Build CPython 3.16 from source (if not cached)
        if: steps.cache-cpython.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libssl-dev zlib1g-dev libffi-dev libsqlite3-dev
          git clone --depth 1 https://github.com/python/cpython.git /tmp/cpython
          cd /tmp/cpython
          ./configure --prefix=/home/runner/py316-${{ matrix.mode }} ${{ matrix.configure-args }}
          make -j$(nproc)
          make install

      - name: Verify CPython 3.16 & GIL state
        run: |
          PYTHON_BIN=$(find /home/runner/py316-${{ matrix.mode }}/bin -name "python3*" -type f -executable | head -n 1)
          $PYTHON_BIN -VV
          $PYTHON_BIN ${{ matrix.gil-flag }} -c "import sys; print('CPython 3.16 Version:', sys.version); print('Free-Threading GIL active:', getattr(sys, '_is_gil_enabled', lambda: 'N/A')())"

      - name: Build C Extension & Run Tests
        env:
          PYTHONPATH: python
        run: |
          PYTHON_BIN=$(find /home/runner/py316-${{ matrix.mode }}/bin -name "python3*" -type f -executable | head -n 1)
          $PYTHON_BIN -m ensurepip --default-pip || true
          $PYTHON_BIN -m pip install --upgrade pip pytest || true
          $PYTHON_BIN setup.py build_ext --inplace || true
          $PYTHON_BIN -m pip install -e . --no-deps || true
          $PYTHON_BIN ${{ matrix.gil-flag }} -m pytest -v tests/ || $PYTHON_BIN ${{ matrix.gil-flag }} -m unittest discover -s tests/

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels via cibuildwheel
      uses: pypa/cibuildwheel@v2.22.0
      env:
        CIBW_ARCHS_MACOS: "x86_64 arm64"

    - uses: actions/upload-artifact@v4
      with:
        name: cibuildwheel-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl
