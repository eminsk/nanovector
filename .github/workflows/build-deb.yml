name: Build Debian/Ubuntu Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-all-dev python3-setuptools python3-wheel python3-numpy dpkg-dev

      - name: Build .deb package
        run: |
          chmod +x debian/rules
          dpkg-buildpackage -us -uc -b -d
          mkdir -p deb-dist
          mv ../python3-nanovector_*.deb deb-dist/

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: deb-dist/*.deb

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: deb-dist/*.deb
