[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanovector"
version = "0.1.1"
description = "Minimalist, bare-metal SIMD-accelerated vector search and episodic memory engine for AI agents in ~120KB with zero dependencies."
readme = "README.md"
authors = [
    { name = "eminsk", email = "M_N_Nik@yahoo.com" }
]
license = { text = "MIT" }
keywords = [
    "vector-database",
    "vector-search",
    "embeddings",
    "ai-agents",
    "memory",
    "simd",
    "avx2",
    "neon",
    "fasm",
    "assembly",
    "llm",
    "rag"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Database :: Database Engines/Servers"
]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.20",
]

[project.urls]
Homepage = "https://github.com/eminsk/nanovector"
Documentation = "https://github.com/eminsk/nanovector#readme"
Repository = "https://github.com/eminsk/nanovector"
"Issue Tracker" = "https://github.com/eminsk/nanovector/issues"
Changelog = "https://github.com/eminsk/nanovector/releases"
