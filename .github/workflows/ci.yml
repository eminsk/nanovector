name: NanoVector CI & Wheel Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version:
          - "3.8"
          - "3.9"
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
          - "3.13t"
          - "3.14t"
          - "3.15t"
          - "pypy-3.8"
          - "pypy-3.9"
          - "pypy-3.10"
          - "pypy-3.11"

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel pytest
        python -m pip install "numpy>=1.20,<2; implementation_name == 'pypy' and python_version < '3.10'" "numpy>=1.20; implementation_name != 'pypy' or python_version >= '3.10'" "typing-extensions>=4.0; python_version < '3.10'"

    - name: Install Package
      run: |
        python -m pip install -e . --no-build-isolation || python -m pip install -e .

    - name: Run Pytest
      env:
        PYTHONPATH: python
      run: |
        pytest -v tests/

    - name: Run Examples
      env:
        PYTHONPATH: python
      run: |
        python examples/01_quickstart.py
        python examples/02_agent_memory.py
        python examples/03_numpy_zerocopy.py

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels via cibuildwheel
      uses: pypa/cibuildwheel@v2.22.0

    - uses: actions/upload-artifact@v4
      with:
        name: cibuildwheel-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl
