name: NanoVector CI & Wheel Builds

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel numpy pytest

    - name: Build C Extension
      run: |
        python setup.py build_ext --inplace

    - name: Run Pytest
      run: |
        pytest -v tests/test_index.py tests/test_multithreading.py

    - name: Run Examples
      run: |
        python examples/01_quickstart.py
        python examples/02_agent_memory.py
        python examples/03_numpy_zerocopy.py

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]

    steps:
    - uses: actions/checkout@v4

    - name: Build wheels via cibuildwheel
      uses: pypa/cibuildwheel@v2.22.0

    - uses: actions/upload-artifact@v4
      with:
        name: cibuildwheel-wheels-${{ matrix.os }}
        path: ./wheelhouse/*.whl
